name: B06 CPU policy full verification
on:
  pull_request:
    paths: ['jobs/B06-cpu-policy/**', '.github/workflows/B06.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: jobs/B06-cpu-policy
      - run: npm test
        working-directory: jobs/B06-cpu-policy
