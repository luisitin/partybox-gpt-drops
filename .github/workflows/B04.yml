name: B04 board research artifact checks
on:
  pull_request:
    paths: ['jobs/B04-jamboree-boards/**', '.github/workflows/B04.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
        working-directory: jobs/B04-jamboree-boards
      - run: python verify.py --structural --checksums
        working-directory: jobs/B04-jamboree-boards
      - name: Record explicit unresolved original research standard
        shell: bash
        run: |
          set +e
          python verify.py --strict
          result=$?
          set -e
          test "$result" -eq 1
        working-directory: jobs/B04-jamboree-boards
