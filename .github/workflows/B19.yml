name: B19 Player-name filter
on:
  pull_request:
    paths: ['jobs/B19-*/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jobs/B19-name-filter
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B19-verification
          path: |
            jobs/B19-name-filter/
            .github/workflows/B19.yml
            !jobs/B19-name-filter/node_modules/**
            !jobs/B19-name-filter/dist/**
          include-hidden-files: true
          retention-days: 30
