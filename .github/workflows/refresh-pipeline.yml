name: Refresh project pipeline

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh tracker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/refresh_pipeline.py
      - name: Commit refreshed tracker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PIPELINE.md
          if git diff --cached --quiet; then
            echo "Pipeline tracker is unchanged."
            exit 0
          fi
          git commit -m "Refresh project pipeline status"
          git push origin HEAD:main
