name: B05 research artifact verification
on:
  pull_request:
    paths: ['jobs/B05-jamboree-turn-flow/**', '.github/workflows/B05.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
        working-directory: jobs/B05-jamboree-turn-flow
      - name: Validate all retained data, audits, citations and hashes
        shell: bash
        run: |
          mkdir -p ../../.work/B05-hosted-ci
          python verify.py --structural --checksums 2>&1 | tee ../../.work/B05-hosted-ci/structural.stdout
        working-directory: jobs/B05-jamboree-turn-flow
      - name: Record unresolved strict research acceptance
        shell: bash
        run: |
          set +e
          python verify.py --strict 2>&1 | tee ../../.work/B05-hosted-ci/strict.stdout
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -eq 1
        working-directory: jobs/B05-jamboree-turn-flow
      - name: Upload complete checked B05 delivery and command output
        uses: actions/upload-artifact@v4
        with:
          name: B05-checked-delivery-${{ github.sha }}
          include-hidden-files: true
          path: |
            jobs/B05-jamboree-turn-flow
            .github/workflows/B05.yml
            .work/B05-hosted-ci
