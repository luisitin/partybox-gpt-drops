name: B13 complete trivia acceptance
on:
  pull_request:
    paths:
      - 'jobs/B13-trivia-1000/**'
      - '.github/workflows/B13.yml'
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned validation tools
        run: python -m pip install -r requirements.txt
        working-directory: jobs/B13-trivia-1000
      - name: Verify delivered checksums
        run: sha256sum --check SHA256SUMS.txt
        working-directory: jobs/B13-trivia-1000
      - name: Validate all original acceptance metadata
        run: python scripts/check-data.py --output reports/ci-checks.json
        working-directory: jobs/B13-trivia-1000
