name: B20 research and prototype specification checks
on:
  pull_request:
    paths: ['jobs/B20-jamboree-modes/**', '.github/workflows/B20.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
        working-directory: jobs/B20-jamboree-modes
      - run: python verify.py --structural --checksums
        working-directory: jobs/B20-jamboree-modes
      - name: Record unresolved original research gates
        shell: bash
        run: |
          set +e
          python verify.py --strict
          result=$?
          set -e
          test "$result" -eq 1
        working-directory: jobs/B20-jamboree-modes
