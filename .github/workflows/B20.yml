name: B20 research and prototype specification checks
on:
  pull_request:
    paths: ['jobs/B20-jamboree-modes/**', '.github/workflows/B20.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
        working-directory: jobs/B20-jamboree-modes
      - run: |
          mkdir -p "$GITHUB_WORKSPACE/.work/B20-hosted-ci"
          python verify.py --structural --checksums | tee "$GITHUB_WORKSPACE/.work/B20-hosted-ci/structural.log"
        shell: bash
        working-directory: jobs/B20-jamboree-modes
      - name: Record unresolved original research gates
        shell: bash
        run: |
          set +e
          python verify.py --strict | tee "$GITHUB_WORKSPACE/.work/B20-hosted-ci/strict.log"
          result=${PIPESTATUS[0]}
          set -e
          printf 'ACTUAL_STRICT_EXIT_CODE=%s\n' "$result" | tee "$GITHUB_WORKSPACE/.work/B20-hosted-ci/strict-exit.log"
          test "$result" -eq 1
        working-directory: jobs/B20-jamboree-modes
      - name: Preserve exact checked delivery and complete outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b20-checked-delivery-${{ github.sha }}
          path: |
            jobs/B20-jamboree-modes/
            .github/workflows/B20.yml
            .work/B20-hosted-ci/
          include-hidden-files: true
          compression-level: 9
          if-no-files-found: error
