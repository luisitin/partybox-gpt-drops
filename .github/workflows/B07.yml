name: B07 full Yahtzee verification
on:
  pull_request:
    paths:
      - 'jobs/B07-*/**'
      - '.github/workflows/B07.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: jobs/B07-yahtzee-optimal/package-lock.json
      - name: Install and run every full seed
        working-directory: jobs/B07-yahtzee-optimal
        env:
          OMP_NUM_THREADS: '2'
        run: |
          npm ci
          npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B07-full-verification-reports
          path: jobs/B07-yahtzee-optimal/reports/
