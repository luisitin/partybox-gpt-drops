name: B18 motion verification
on:
  pull_request:
    paths: ['jobs/B18-*/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jobs/B18-motion-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: jobs/B18-motion-ts/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B18-verification-results
          path: jobs/B18-motion-ts/.work/results/
          if-no-files-found: error
          include-hidden-files: true
